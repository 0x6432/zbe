name: Zig-native rewrite

on:
  push:
    branches: [rewrite/zig-native]
    paths: ['rewrite/**', '.github/workflows/rewrite.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Rewrite core (${{ matrix.optimize }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        optimize: [Debug, ReleaseSafe, ReleaseFast]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.18.0-dev.35+5e754304d
      - name: Formatting
        working-directory: rewrite
        run: zig fmt --check build.zig src
      - name: Integer oracle reproducibility
        working-directory: rewrite
        run: |
          python3 tools/generate_integer_oracle.py --check
          python3 tools/generate_scalar_oracle.py --check
          python3 tools/generate_unary_oracle.py --check
          python3 tools/generate_division_oracle.py --check
          python3 tools/generate_program_oracle.py --check
          python3 tools/generate_float_oracle.py --check
          python3 tools/generate_conversion_oracle.py --check
          python3 tools/generate_float_comparison_oracle.py --check
          python3 tools/generate_memory_oracle.py --check
          python3 tools/generate_signed_conversion_oracle.py --check
          python3 tools/generate_unsigned_conversion_oracle.py --check
          python3 tools/generate_low_word_oracle.py --check
          python3 tools/generate_data_oracle.py --check
          python3 tools/generate_data_string_oracle.py --check
      - name: Independent IR/frontend tests (not backend parity)
        working-directory: rewrite
        run: zig build test -Doptimize=${{ matrix.optimize }} --summary all
      - name: Experimental Linux AMD64 scalar execution
        working-directory: rewrite
        run: |
          zig build -Doptimize=${{ matrix.optimize }} --summary all
          for flags in "" "--fold-integers" "--reuse-stack-homes" "--fold-integers --reuse-stack-homes" "--callee-saved-homes" "--fold-integers --callee-saved-homes" "--reuse-stack-homes --callee-saved-homes" "--fold-integers --reuse-stack-homes --callee-saved-homes"; do
            printf "Native options: %s\n" "$flags"
            python3 tools/native_check.py $flags
            python3 tools/native_float_check.py $flags
            python3 tools/native_call_check.py $flags
            python3 tools/native_memory_check.py $flags
            python3 tools/native_blit_check.py $flags
            python3 tools/native_numeric_check.py $flags
            python3 tools/native_low_word_check.py $flags
            python3 tools/native_frame_check.py $flags
            python3 tools/native_allocation_check.py $flags
            python3 tools/native_symbol_check.py $flags
            python3 tools/native_data_check.py $flags
            python3 tools/native_relocation_check.py $flags
            python3 tools/native_string_check.py $flags
            python3 tools/native_bss_check.py $flags
          python3 tools/native_offset_check.py $flags
          python3 tools/native_subword_check.py $flags
          python3 tools/native_variadic_check.py $flags
          python3 tools/native_vaarg_check.py $flags
          python3 tools/native_varfn_check.py $flags
          python3 tools/native_environment_check.py $flags
          done
