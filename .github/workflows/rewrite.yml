name: Zig-native rewrite

on:
  push:
    branches: [rewrite/zig-native]
    paths: ['rewrite/**', '.github/workflows/rewrite.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Rewrite core (${{ matrix.optimize }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        optimize: [Debug, ReleaseSafe, ReleaseFast]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.18.0-dev.35+5e754304d
      - name: Formatting
        working-directory: rewrite
        run: zig fmt --check build.zig src
      - name: Integer oracle reproducibility
        working-directory: rewrite
        run: python3 tools/generate_integer_oracle.py --check
      - name: Independent IR/frontend tests (not backend parity)
        working-directory: rewrite
        run: zig build test -Doptimize=${{ matrix.optimize }} --summary all
      - name: Experimental Linux AMD64 integer execution
        working-directory: rewrite
        run: |
          zig build -Doptimize=${{ matrix.optimize }} --summary all
          python3 tools/native_check.py
